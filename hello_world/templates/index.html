{% load django_browser_reload %}
{% load static %}

<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="GitHub Codespaces ♥️ Django">
    <meta name="author" content="GitHub Codespaces">
    <meta name="generator" content="GitHub Codespaces">
    <meta name="theme-color" content="#000000">
    <title>{% block title %}{{ title }} | GitHub Codespaces ♥️ Django{% endblock %}</title>
    
    <link rel="stylesheet" href="{% static 'main.css' %}">
</head>

<body>
    <div class="App">
        <header class="App-header">
            <form method="GET">
                <select name="first" onchange="this.form.submit()">
                    <option value="">Select first</option>
                    {% for first in firsts %}
                        <option value="{{ first }}" 
                                {% if first == selected_first %}selected{% endif %}>
                            {{ first }}
                        </option>
                    {% endfor %}
                </select>
            
                {% if seconds %}
                <select name="second" onchange="this.form.submit()">
                    <option value="">Select second</option>
                    {% for second in seconds %}
                        <option value="{{ second }}" 
                                {% if second == selected_second %}selected{% endif %}>
                            {{ second }}
                        </option>
                    {% endfor %}
                </select>
                {% endif %}
            </form>

            <!-- <img src="{% static 'Octocat.png' %}" class="App-logo" alt="logo" /> -->
            <p>
                GitHub Codespaces <span class="heart">♥️</span> Django
            </p>
            <p class="small">
                This is Vedant Madane's website!
            </p>
        </header>
    </div>
</body>

</html>
